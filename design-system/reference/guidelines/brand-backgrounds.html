<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../reference.css"><style>body{margin:0;padding:24px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;flex-direction:column;gap:8px;min-width:0}.chip{height:72px;border-radius:16px;border:1px solid rgba(6,46,53,0.06)}.n{font-size:13px;font-weight:500}.h{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono)}.g{display:grid;gap:12px}.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}.p{border-radius:20px;height:150px;display:flex;align-items:flex-end;padding:14px;font-size:12px}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div class="p" style="background:var(--bg-app)">--bg-app</div><div class="p" style="background:var(--bg-hero)">--bg-hero</div><div class="p" style="background:var(--pattern-dots),var(--gradient-dark-hero);color:#fff">--pattern-dots + --gradient-dark-hero</div></div></body></html>
