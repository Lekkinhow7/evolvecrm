<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../reference.css"><style>body{margin:0;padding:24px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;flex-direction:column;gap:8px;min-width:0}.chip{height:72px;border-radius:16px;border:1px solid rgba(6,46,53,0.06)}.n{font-size:13px;font-weight:500}.h{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono)}.g{display:grid;gap:12px}.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}body{background:var(--bg-app)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px"><div class="sw"><div style="height:96px;background:#fff;border-radius:20px;box-shadow:var(--shadow-xs)"></div><div class="n">xs</div><div class="h">--shadow-xs</div></div><div class="sw"><div style="height:96px;background:#fff;border-radius:20px;box-shadow:var(--shadow-sm)"></div><div class="n">sm</div><div class="h">--shadow-sm</div></div><div class="sw"><div style="height:96px;background:#fff;border-radius:20px;box-shadow:var(--shadow-md)"></div><div class="n">md</div><div class="h">--shadow-md</div></div><div class="sw"><div style="height:96px;background:#fff;border-radius:20px;box-shadow:var(--shadow-lg)"></div><div class="n">lg</div><div class="h">--shadow-lg</div></div><div class="sw"><div style="height:96px;background:#fff;border-radius:20px;box-shadow:var(--shadow-modal)"></div><div class="n">modal</div><div class="h">--shadow-modal</div></div></div><div style="display:flex;gap:16px;margin-top:4px"></div></body></html>
