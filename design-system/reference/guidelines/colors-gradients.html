<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../reference.css"><style>body{margin:0;padding:24px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;flex-direction:column;gap:8px;min-width:0}.chip{height:72px;border-radius:16px;border:1px solid rgba(6,46,53,0.06)}.n{font-size:13px;font-weight:500}.h{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono)}.g{display:grid;gap:12px}.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div class="sw"><div class="chip" style="background:var(--gradient-ink);"></div><div class="n">Ink</div><div class="h">--gradient-ink</div></div><div class="sw"><div class="chip" style="background:var(--gradient-cyan);"></div><div class="n">Cyan</div><div class="h">--gradient-cyan</div></div><div class="sw"><div class="chip" style="background:var(--gradient-lime);"></div><div class="n">Lime</div><div class="h">--gradient-lime</div></div><div class="sw"><div class="chip" style="background:var(--gradient-nav-active);"></div><div class="n">Nav active</div><div class="h">--gradient-nav-active</div></div><div class="sw"><div class="chip" style="background:var(--viz-bar);"></div><div class="n">Bar</div><div class="h">--viz-bar</div></div><div class="sw"><div class="chip" style="background:var(--viz-hatch);background-color:#fff"></div><div class="n">Hatch</div><div class="h">--viz-hatch</div></div></div></body></html>
