<!-- @dsCard group="Colors" viewport="700x150" name="Status colours" subtitle="Semantic tint + text pairs (--status-*-bg / -fg)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../reference.css"><style>body{margin:0;padding:24px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;flex-direction:column;gap:8px;min-width:0}.chip{height:72px;border-radius:16px;border:1px solid rgba(6,46,53,0.06)}.n{font-size:13px;font-weight:500}.h{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono)}.g{display:grid;gap:12px}.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span style="display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;font-size:13px;background:var(--status-info-bg);color:var(--status-info-fg)">Due today</span><div class="n">info</div><div class="h" style="font-family:var(--font-sans)">recorded, valid, within limits</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span style="display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;font-size:13px;background:var(--status-success-bg);color:var(--status-success-fg)">Done</span><div class="n">success</div><div class="h" style="font-family:var(--font-sans)">closed, completed</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span style="display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;font-size:13px;background:var(--status-warning-bg);color:var(--status-warning-fg)">Due soon</span><div class="n">warning</div><div class="h" style="font-family:var(--font-sans)">review, deviations</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span style="display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;font-size:13px;background:var(--status-danger-bg);color:var(--status-danger-fg)">Overdue</span><div class="n">danger</div><div class="h" style="font-family:var(--font-sans)">blocked, expired</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span style="display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;font-size:13px;background:var(--status-active-bg);color:var(--status-active-fg)">In progress</span><div class="n">active</div><div class="h" style="font-family:var(--font-sans)">current, enabled</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span style="display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;font-size:13px;background:var(--status-neutral-bg);color:var(--status-neutral-fg)">7 days</span><div class="n">neutral</div><div class="h" style="font-family:var(--font-sans)">meta, periods, counts</div></div></div></body></html>
