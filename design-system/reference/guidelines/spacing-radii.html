<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../reference.css"><style>body{margin:0;padding:24px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;flex-direction:column;gap:8px;min-width:0}.chip{height:72px;border-radius:16px;border:1px solid rgba(6,46,53,0.06)}.n{font-size:13px;font-weight:500}.h{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono)}.g{display:grid;gap:12px}.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:12px"><div class="sw"><div style="height:76px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:4px"></div><div class="n">xs</div><div class="h">4px</div></div><div class="sw"><div style="height:76px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:8px"></div><div class="n">sm</div><div class="h">8px</div></div><div class="sw"><div style="height:76px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px"></div><div class="n">md</div><div class="h">12px</div></div><div class="sw"><div style="height:76px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:16px"></div><div class="n">lg</div><div class="h">16px</div></div><div class="sw"><div style="height:76px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:24px"></div><div class="n">xl</div><div class="h">24px</div></div><div class="sw"><div style="height:76px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:32px"></div><div class="n">2xl</div><div class="h">32px</div></div><div class="sw"><div style="height:76px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:999px"></div><div class="n">pill</div><div class="h">999px</div></div></div></body></html>
