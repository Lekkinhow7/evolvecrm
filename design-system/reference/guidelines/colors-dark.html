<!-- @dsCard group="Colors" viewport="700x200" name="Dark theme" subtitle="[data-theme=dark] — same tokens, swapped values; primary action turns cyan" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../reference.css"><style>body{margin:0;padding:24px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;flex-direction:column;gap:8px;min-width:0}.chip{height:72px;border-radius:16px;border:1px solid rgba(6,46,53,0.06)}.n{font-size:13px;font-weight:500}.h{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono)}.g{display:grid;gap:12px}.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}body{background:#06171C}</style></head><body><div data-theme="dark" style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;color:var(--text-primary)"><div class="sw"><div class="chip" style="background:var(--bg-page);border-color:rgba(255,255,255,.08)"></div><div class="n">bg-page</div><div class="h">#06171C</div></div><div class="sw"><div class="chip" style="background:var(--surface-card);border-color:rgba(255,255,255,.08)"></div><div class="n">surface-card</div><div class="h">#0D252C</div></div><div class="sw"><div class="chip" style="background:var(--surface-muted);border-color:rgba(255,255,255,.08)"></div><div class="n">surface-muted</div><div class="h">#112D35</div></div><div class="sw"><div class="chip" style="background:var(--action-primary-bg);border-color:rgba(255,255,255,.08)"></div><div class="n">action-primary</div><div class="h">#1B8FAE</div></div><div class="sw"><div class="chip" style="background:var(--text-primary);"></div><div class="n">text-primary</div><div class="h">#E8F2F4</div></div></div></body></html>
